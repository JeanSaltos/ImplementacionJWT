spring.application.name=usuarios

server.address=0.0.0.0
server.port=${SERVER_PORT:9090}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/usuarios_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}

# JWT
jwt.secret=${JWT_SECRET:parqueaderito-secret-key-dev-only-change-in-production-256bits}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Swagger (solo en desarrollo)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled=true

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4200,http://localhost:3002}
