name: ParkingApp CI

on:
  push:
    branches:
      - main
      - test
      - dev
      - "feature/**"
  pull_request:
    branches:
      - main
      - test
      - dev

permissions:
  contents: read

jobs:
  spring-services:
    name: Spring Boot services
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - usuarios
          - zonas-espacios

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        run: |
          chmod +x ./mvnw
          ./mvnw -B test

  nest-services:
    name: NestJS services
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - vehiqlos
          - tickets

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm ci

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: npm test

      - name: Build
        working-directory: ${{ matrix.service }}
        run: npm run build

  sonarcloud:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    needs:
      - spring-services
      - nest-services
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node.js
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare Java binaries for analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        run: |
          chmod +x usuarios/mvnw zonas-espacios/mvnw
          (cd usuarios && ./mvnw -B -DskipTests compile)
          (cd zonas-espacios && ./mvnw -B -DskipTests compile)

      - name: Prepare TypeScript coverage inputs
        if: ${{ env.SONAR_TOKEN != '' }}
        run: |
          (cd vehiqlos && npm ci && npm run test:cov)
          (cd tickets && npm ci && npm run test:cov)

      - name: Run SonarCloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v8.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Skip SonarCloud scan
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "SONAR_TOKEN is not configured; skipping SonarCloud analysis."

  notify:
    name: Telegram notification
    runs-on: ubuntu-latest
    needs:
      - spring-services
      - nest-services
      - sonarcloud
    if: ${{ always() }}

    steps:
      - name: Send Telegram message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SPRING_RESULT: ${{ needs.spring-services.result }}
          NEST_RESULT: ${{ needs.nest-services.result }}
          SONAR_RESULT: ${{ needs.sonarcloud.result }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured; skipping notification."
            exit 0
          fi

          MESSAGE="ParkingApp CI finished%0ARepository: $GITHUB_REPOSITORY%0ABranch: $GITHUB_REF_NAME%0ACommit: $GITHUB_SHA%0ASpring: $SPRING_RESULT%0ANestJS: $NEST_RESULT%0ASonarCloud: $SONAR_RESULT%0ARun: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MESSAGE}"
